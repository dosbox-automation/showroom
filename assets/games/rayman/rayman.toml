# Generated once from showroom-games-sources.csv by tools/csv_to_games.py.
# This file is the source of truth for the game and is maintained by hand
# from here on: the generator will not overwrite it without --force.
#
# candidate: https://dosgames.com/game/rayman/

slug = "rayman"
title = "Rayman"
rank = 9
license = "demo"
recipe_status = "done"

[sources.primary]
role = "primary"
install_type = "unzip"
url = "https://dosgames.com/files/raymandemo.zip"

[sources.mirror]
role = "mirror"
install_type = "unzip"
url = "https://www.classicdosgames.com/files/games/ubisoft/raydemo.exe"

# Starting point from the drive rig, which ran every game at these
# settings. Tune per game where the game needs it.
[dosbox]
machine = "svga_s3"
cpu_cycles = 12000
cpu_cycles_protected = 12000

[dosbox.sound]
sblaster_type = "sb16"
mpu401 = "intelligent"
midi_device = "fluidsynth"

# HAND-FILLED. Pre-installed demo dump; HMI sound autodetects,
# no config file needed (probe 2026-08-02).
[launch]
executable = "RAYMAN.EXE"
working_dir = ""
setup_exe = ""

[screenshots]
title = "title.png"
gameplay = "gameplay.png"

[install]
max_runtime_seconds = 120

# HAND-FILLED. Files that must exist after a successful install,
# checked before every launch. Sound config files vary - leave them out.
[install.expected_files]
"RAYMAN.EXE"       = { size = 412264 }
"PCMAP/ALLFIX.DAT" = { size = 519234 }
