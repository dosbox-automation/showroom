# Generated once from showroom-games-sources.csv by tools/csv_to_games.py.
# This file is the source of truth for the game and is maintained by hand
# from here on: the generator will not overwrite it without --force.
#
# candidate: https://www.classicdosgames.com/files/games/epic/epicpn21.zip ; also on dosgames.com

slug = "epinball"
title = "Epic Pinball"
rank = 2
version = "2.1"
license = "shareware"
recipe_status = "done"

[sources.primary]
role = "primary"
install_type = "exeinstall"
url = "https://archive.org/download/TOEMGSWC/EPICSWCD96/EPIC/EPICPN21.EXE"

[sources.mirror]
role = "mirror"
install_type = "unzip"
url = "https://www.classicdosgames.com/files/games/epic/epicpn21.zip"

# Starting point from the drive rig, which ran every game at these
# settings. Tune per game where the game needs it.
[dosbox]
machine = "svga_s3"
cpu_cycles = 12000
cpu_cycles_protected = 12000

[dosbox.sound]
sblaster_type = "sb16"
mpu401 = "intelligent"
midi_device = "fluidsynth"

# HAND-FILLED. The extractor menu names the payload "Epic Pinball:
# SUPER ANDROID"; it installs to \EPICPIN and the recipe configures
# sound via the shipped SETUP.EXE (probe 2026-08-02).
[launch]
executable = "PINBALL.EXE"
working_dir = "EPICPIN"
setup_exe = "SETUP.EXE"

[screenshots]
title = "title.png"
gameplay = "gameplay.png"

[install]
max_runtime_seconds = 300

# HAND-FILLED. Files that must exist after a successful install,
# checked before every launch. Sound config files vary - leave them out.
[install.expected_files]
"EPICPIN/PINBALL.EXE" = { size = 37477 }
"EPICPIN/EP1.EXE"     = { size = 251771 }
