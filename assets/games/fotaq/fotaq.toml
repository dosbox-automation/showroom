# Generated once from showroom-games-sources.csv by tools/csv_to_games.py.
# This file is the source of truth for the game and is maintained by hand
# from here on: the generator will not overwrite it without --force.
#
# secondary is just demo

slug = "fotaq"
title = "Flight of the Amazon Queen"
rank = 11
license = "freeware"
recipe_status = "done"

[sources.primary]
role = "primary"
install_type = "floppyinstall"
url = "https://archive.org/download/001262-FlightOfTheAmazonQueen/001262_flight_of_the_amazon_queen.7z/"

[sources.mirror]
role = "mirror"
install_type = "unzip"
url = "https://www.classicdosgames.com/files/games/geewhiz/amazon.zip"

# Starting point from the drive rig, which ran every game at these
# settings. Tune per game where the game needs it.
[dosbox]
machine = "svga_s3"
cpu_cycles = 12000
cpu_cycles_protected = 12000

[dosbox.sound]
sblaster_type = "sb16"
mpu401 = "intelligent"
midi_device = "fluidsynth"

# HAND-FILLED. Six-floppy installer set (full game - the mirror zip is
# only the demo). AQ.BAT runs the game's own setup on first start; the
# game keeps config/saves in QUEEN.SAV at the drive root (probe
# 2026-08-02).
[launch]
executable = "AQ.BAT"
working_dir = "QUEEN"
setup_exe = "SETUP.EXE"

[screenshots]
title = "title.png"
gameplay = "gameplay.png"

[install]
max_runtime_seconds = 420

# HAND-FILLED. Files that must exist after a successful install,
# checked before every launch. Sound config files vary - leave them out.
[install.expected_files]
"QUEEN/QUEEN.EXE" = { size = 287285 }
"QUEEN/QUEEN.1"   = { size = 22677657 }
