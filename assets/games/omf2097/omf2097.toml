# Epic freeware'd 1999; candidate: https://dosgames.com/game/one-must-fall-2097/

slug = "omf2097"
title = "One Must Fall 2097"
rank = 6
version = "2.1"
license = "freeware"
recipe_status = "todo"

[sources.primary]
role = "primary"
install_type = "exeinstall"
url = "https://archive.org/download/TOEMGSWC/EPICSWCD96/EPIC/OMFSW21.EXE"

[sources.mirror]
role = "mirror"
install_type = "exeinstall"
url = "https://archive.org/download/one-must-fall-2097-shareware-jukebox-collection"

# Starting point from the drive rig, which ran every game at these
# settings. Tune per game where the game needs it.
[dosbox]
machine = "svga_s3"
cpu_cycles = 12000
cpu_cycles_protected = 12000

[dosbox.sound]
sblaster_type = "sb16"
mpu401 = "intelligent"
midi_device = "fluidsynth"

# HAND-FILLED. The extractor installs to \OMF; OMF.EXE is the DOS4GW
# loader stub. Sound set via the graphics-mode SETUP.EXE (probe
# 2026-08-02).
[launch]
executable = "OMF.EXE"
working_dir = "OMF"
setup_exe = "SETUP.EXE"

[screenshots]
title = "title.png"
gameplay = "gameplay.png"

[install]
max_runtime_seconds = 300

# HAND-FILLED. Files that must exist after a successful install,
# checked before every launch. Sound config files vary - leave them out.
[install.expected_files]
"OMF/OMF.EXE"    = { size = 4448 }
"OMF/SOUNDS.DAT" = { size = 280758 }
