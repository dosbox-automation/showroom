# Starting point from the drive rig, which ran every game at these
# settings. Tune per game where the game needs it.
[dosbox]
machine = "svga_s3"
cpu_cycles = 12000
cpu_cycles_protected = 12000

[dosbox.sound]
sblaster_type = "sb16"
mpu401 = "intelligent"
midi_device = "fluidsynth"

# HAND-FILLED. The extractor installs to \JAZZ; sound set via the
# text-mode SETUP.EXE (probe 2026-08-02). The JAZZSW11 build's title
# bar reports "Version 1.0" despite the 1.1 filename.
[launch]
executable = "JAZZ.EXE"
working_dir = "JAZZ"
setup_exe = "SETUP.EXE"

[screenshots]
title = "title.png"
gameplay = "gameplay.png"

[install]
max_runtime_seconds = 300

# HAND-FILLED. Files that must exist after a successful install,
# checked before every launch. Sound config files vary - leave them out.
[install.expected_files]
"JAZZ/JAZZ.EXE"     = { size = 227328 }
