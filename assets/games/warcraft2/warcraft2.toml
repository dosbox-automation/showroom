# demo to source

slug = "warcraft2"
title = "Warcraft 2"
rank = 15
version = "1.08sh"
license = "demo"
recipe_status = "done"

year = 1995
publisher = "Blizzard Entertainment"
blurb = "The sequel added naval combat, eight-player multiplayer and a map editor to the original Warcraft formula. The one that put Blizzard on the map."

[sources.primary]
role = "primary"
install_type = "isoinstall"
url = "https://archive.org/download/War2TOD-Demo-108sh/War2Demo_v108sh.iso"
sha256 = "44bf68e3384dd94276b32f0a69b4d2637fd4bee2482fa748892bcc5f08a33bc8"

[sources.mirror]
role = "mirror"
install_type = "unzip"
url = "https://dosgames.com/files/DOSBOX_WAR2.ZIP"
sha256 = "3081ec839803242a240b6ff22d70c983117ef1345974a864db6cdaf340c97d46"

# Starting point from the drive rig, which ran every game at these
# settings. Tune per game where the game needs it.
[dosbox]
machine = "svga_s3"
cpu_cycles = 30000
cpu_cycles_protected = 30000

[dosbox.sound]
sblaster_type = "sb16"
mpu401 = "intelligent"
midi_device = "fluidsynth"

# HAND-FILLED. An empty executable means the game has no recipe yet;
# the showroom shows the tile but refuses to launch it.
[launch]
executable = "WAR2.EXE"
working_dir = "WAR2"
setup_exe = "SETUP.EXE"

[screenshots]
title = "title.png"
gameplay = "gameplay.png"

[install]
max_runtime_seconds = 420

# HAND-FILLED. Files that must exist after a successful install,
# checked before every launch. Sound config files vary - leave them out.
[install.expected_files]
"WAR2/WAR2.EXE" = { size = 877567 }
"WAR2/SETUP.EXE" = { size = 581265 }
