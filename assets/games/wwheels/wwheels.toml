# Generated once from showroom-games-sources.csv by tools/csv_to_games.py.
# This file is the source of truth for the game and is maintained by hand
# from here on: the generator will not overwrite it without --force.
#
# candidate: https://dosgames.com/game/wacky-wheels/

slug = "wwheels"
title = "Wacky Wheels"
rank = 12
version = "1.1"
license = "shareware"
recipe_status = "done"

# Swapped 2026-08-02: the 1994 Apogee shareware with its real INSTALL.EXE
# is the primary (visible install, original timestamps); the pre-installed
# dosbox-ready dump demotes to mirror.
year = 1994
publisher = "Apogee Software"
blurb = "Kart racing with animals and hedgehog projectiles. Split-screen multiplayer, adjustable opponents, and exactly the game you think it is."

[sources.primary]
role = "primary"
install_type = "unzipinstall"
url = "https://www.classicdosgames.com/files/games/beavis-soft/1wacky.zip"
sha256 = "c61e8b2d41d4b0380366ab5104389cc97b850ec6d6d37e8030404f67ead8cd7e"

[sources.mirror]
role = "mirror"
install_type = "unzip"
url = "https://dosgames.com/files/DOSBOX_WACKY.ZIP"
sha256 = "3c3c35bb696194b420c5156ac9641819213f01812801f5c1683817c8bb70f4a3"
# The zip is flat; the canonical layout keeps the game under WACKY/.
target_subdir = "WACKY"

# Starting point from the drive rig, which ran every game at these
# settings. Tune per game where the game needs it.
[dosbox]
machine = "svga_s3"
cpu_cycles = 12000
cpu_cycles_protected = 12000

[dosbox.sound]
sblaster_type = "sb16"
mpu401 = "intelligent"
midi_device = "fluidsynth"

# HAND-FILLED. The Apogee installer unpacks WWSW11.SHR to \WACKY; the
# recipe drives SETUP for SB effects + General MIDI music (probe
# 2026-08-02).
[launch]
executable = "WW.EXE"
working_dir = "WACKY"
setup_exe = "SETUP.EXE"

[screenshots]
title = "title.png"
gameplay = "gameplay.png"

[install]
max_runtime_seconds = 300

# HAND-FILLED. Files that must exist after a successful install,
# checked before every launch. Sound config files vary - leave them out.
[install.expected_files]
"WACKY/WW.EXE"    = { size = 650437 }
"WACKY/WACKY.DAT" = { size = 4398948 }
