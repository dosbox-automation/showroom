# Generated once from showroom-games-sources.csv by tools/csv_to_games.py.
# This file is the source of truth for the game and is maintained by hand
# from here on: the generator will not overwrite it without --force.
#
# gold release, other versions (not compatible with our script): https://www.doomworld.com/forum/topic/119164-doom-shareware-floppy-disk-archive/

slug = "doom"
title = "DOOM"
rank = 1
version = "1.666"
license = "shareware"
recipe_status = "done"

[sources.primary]
role = "primary"
install_type = "floppyinstall"
url = "https://archive.org/download/doom-shareware-floppy-v-1.666-2-disk.-7z/Doom%20Shareware%20Floppy%20%28v1.666%29%20%5B2%20Disk%5D.7z"
sha256 = "397136eeb7f565c7e47c0041ed0862ded788a209e3d4e75e91893867cdff2f1f"

[sources.mirror]
role = "mirror"
install_type = "isoinstall"
url = "https://archive.org/download/shareware_202206/SHAREWARE.iso"
sha256 = "3273faec8b3506525df4f7f7834e0dcba8ee213a9032e2877763ea6a67a070b4"

# Starting point from the drive rig, which ran every game at these
# settings. Tune per game where the game needs it.
[dosbox]
machine = "svga_s3"
cpu_cycles = 12000
cpu_cycles_protected = 12000

[dosbox.sound]
sblaster_type = "sb16"
mpu401 = "intelligent"
midi_device = "fluidsynth"

# HAND-FILLED. An empty executable means the game has no recipe yet;
# the showroom shows the tile but refuses to launch it.
#
# The installer nests the game two levels down: the install root holds
# GOLD.BAT and GOLD/, and the game itself is in GOLD/DOOM/. Paths are
# POSIX-style here and converted to DOS separators when the run conf is
# written. Verified against .games-cache/installs/doom/ on 2026-07-26.
[launch]
executable = "DOOM.EXE"
working_dir = "GOLD/DOOM"
setup_exe = "SETUP.EXE"

[screenshots]
title = "title.png"
gameplay = "gameplay.png"

[install]
max_runtime_seconds = 120

# HAND-FILLED. Files that must exist after a successful install,
# checked before every launch. Sound config files vary - leave them out.
# DEFAULT.CFG is deliberately absent: the game writes it at runtime.
[install.expected_files]
"GOLD/DOOM/DOOM.EXE"  = { size = 687001 }
"GOLD/DOOM/DOOM1.WAD" = { size = 4234124 }
