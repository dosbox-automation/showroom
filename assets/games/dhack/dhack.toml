# Starting point from the drive rig, which ran every game at these
# settings. Tune per game where the game needs it.
[dosbox]
machine = "svga_s3"
cpu_cycles = 12000
cpu_cycles_protected = 12000

[dosbox.sound]
sblaster_type = "sb16"
mpu401 = "intelligent"
midi_device = "fluidsynth"

# HAND-FILLED. Pre-extracted AESOP demo; HACK.BAT orchestrates the
# aesop/maze loop and creates savegame/ itself (probe 2026-08-02).
# The archive carries its own HACKDEMO/ top level, so nothing lands at
# the drive root (aug-dos6).
[launch]
executable = "HACK.BAT"
working_dir = "HACKDEMO"
setup_exe = ""

[screenshots]
title = "title.png"
gameplay = "gameplay.png"

[install]
max_runtime_seconds = 120

# HAND-FILLED. Files that must exist after a successful install,
# checked before every launch. Sound config files vary - leave them out.
[install.expected_files]
"HACKDEMO/AESOP.EXE" = { size = 140240 }
