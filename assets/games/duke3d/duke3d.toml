# Generated once from showroom-games-sources.csv by tools/csv_to_games.py.
# This file is the source of truth for the game and is maintained by hand
# from here on: the generator will not overwrite it without --force.
#
# Shareware v1.3d (repinned from v1.1 2026-08-08: the v1.3d zip
# carries 3D Realms' LICENSE.TXT, the v1.1 packages carried no licence
# text). Setup-driving showcase. The v1.3d installer is text-mode
# throughout, unlike v1.1's mode 13h one; the recipe was rewritten
# against it 2026-08-11. Cycles are raised for the archive inflate.

slug = "duke3d"
title = "Duke Nukem 3D"
rank = 10
license = "shareware"
recipe_status = "done"

year = 1996
publisher = "3D Realms"
blurb = "Aliens invaded Los Angeles and Duke has opinions about it. Destructible bars, working pool tables, and a mirror that knows you are looking."

[sources.primary]
role = "primary"
install_type = "unzipinstall"
url = "https://archive.org/download/3dduke13/3dduke13.zip"
sha256 = "c67efd179022bc6d9bde54f404c707cbcbdc15423c20be72e277bc2bdddf3d0e"

[sources.mirror]
role = "mirror"
install_type = "unzipinstall"
url = "https://www.classicdosgames.com/files/games/apogee/3dduke13.zip"
sha256 = "c67efd179022bc6d9bde54f404c707cbcbdc15423c20be72e277bc2bdddf3d0e"

# Starting point from the drive rig, which ran every game at these
# settings. Tune per game where the game needs it.
[dosbox]
machine = "svga_s3"
cpu_cycles = 32000
cpu_cycles_protected = 32000

[dosbox.sound]
sblaster_type = "sb16"
mpu401 = "intelligent"
midi_device = "fluidsynth"

# HAND-FILLED. An empty executable means the game has no recipe yet;
# the showroom shows the tile but refuses to launch it.
[launch]
executable = "DUKE3D.EXE"
working_dir = "DUKE3D"
setup_exe = "SETUP.EXE"

[screenshots]
title = "title.png"
gameplay = "gameplay.png"

[install]
max_runtime_seconds = 300

# HAND-FILLED. Files that must exist after a successful install,
# checked before every launch. Sound config files vary - leave them out.
[install.expected_files]
"DUKE3D/DUKE3D.EXE" = { size = 1178963 }
"DUKE3D/DUKE3D.GRP" = { size = 11035779 }
